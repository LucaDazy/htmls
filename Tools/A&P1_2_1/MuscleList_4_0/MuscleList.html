<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle List</title>
    <link rel="stylesheet" href="../../../Global/Css/main.css">
    <link rel="stylesheet" href="../../../Global/Css/animations.css">
    <style>
        :root {
            --origin-color: var(--error);
            --insert-color: var(--accent);
            --action-color: var(--success);
        }

        /* Override for this tool's wider layout */
        .container { max-width: 900px; }

        /* Section Navigation */
        .nav-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
            margin-bottom: 0.5rem; width: 100%;
        }
        .back-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(165, 104, 157, 0.1); /* accent with opacity */
        }
        
        /* Tool Bar */
        .header-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            background: var(--panel-bg); padding: 1rem 1.5rem; border-radius: 8px;
            box-sizing: border-box; flex-wrap: wrap; gap: 1rem;
        }
        
        .progress-text {
            font-size: 0.95rem; color: var(--panel-bg); background: var(--accent);
            padding: 0.4rem 1rem; border-radius: 20px; font-weight: bold; letter-spacing: 0.5px;
        }

        /* Card Area */
        .card-box {
            background: transparent;
            border: 2px solid transparent; /* Fallback, overridden by stage */
            border-radius: 8px; padding: 2rem;
            display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;
            position: relative; transition: border-color 0.3s;
        }
        .stage-badge {
            position: absolute; top: 1rem; left: 1rem; padding: 0.3rem 0.8rem; border-radius: 4px;
            font-weight: bold; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s;
        }

        /* Dynamic Stage Colors */
        .stage-0 { border-color: var(--origin-color) !important; }
        .stage-0 .stage-badge { background: rgba(224, 94, 117, 0.2); color: var(--origin-color); border: 1px solid var(--origin-color); }
        .stage-1 { border-color: var(--insert-color) !important; }
        .stage-1 .stage-badge { background: rgba(165, 104, 157, 0.2); color: var(--insert-color); border: 1px solid var(--insert-color); }
        .stage-2 { border-color: var(--action-color) !important; }
        .stage-2 .stage-badge { background: rgba(77, 182, 172, 0.2); color: var(--action-color); border: 1px solid var(--action-color); }

        .muscle-title {
            font-size: 2rem; color: var(--minimal-white); font-weight: bold; text-align: center;
            margin-top: 1.5rem; margin-bottom: 2rem; letter-spacing: 1px;
        }

        /* Options Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; }
        @media (max-width: 700px) { .options-grid { grid-template-columns: 1fr; } }

        .opt-btn {
            background: transparent; border: 2px solid var(--text-muted); color: var(--text-main);
            padding: 1.2rem 1rem; border-radius: 6px; font-family: var(--font-family-mono); font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s; line-height: 1.4; text-align: left; font-weight: bold;
        }
        .opt-btn:hover:not(:disabled):not(.dimmed) { background: var(--hover-bg); }

        /* Dynamic Option Hover Colors */
        .stage-0 .opt-btn:hover:not(:disabled):not(.dimmed) { border-color: var(--origin-color); }
        .stage-1 .opt-btn:hover:not(:disabled):not(.dimmed) { border-color: var(--insert-color); }
        .stage-2 .opt-btn:hover:not(:disabled):not(.dimmed) { border-color: var(--action-color); }

        .opt-btn.correct { border-color: var(--success) !important; background: rgba(77, 182, 172, 0.2) !important; color: var(--success) !important; }
        .opt-btn.wrong { border-color: var(--error) !important; background: rgba(224, 94, 117, 0.2) !important; color: var(--error) !important; animation: shake 0.3s; }
        .opt-btn.dimmed { opacity: 0.2; pointer-events: none; }
        .opt-btn:disabled { cursor: default; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }

        /* Hint & Feedback */
        .hint-box {
            background: rgba(165, 104, 157, 0.1); border: 1px solid var(--accent); color: var(--accent);
            padding: 1rem; border-radius: 6px; font-size: 0.95rem; margin-bottom: 1.5rem;
            display: none; line-height: 1.5; width: 100%; box-sizing: border-box; text-align: center;
        }
        .completion-msg { display: none; width: 100%; text-align: center; font-size: 1.1rem; font-weight: bold; margin-top: 1.5rem; padding: 1.2rem; border-radius: 6px; }
        .end-screen { text-align: center; display: none; background: var(--panel-bg); padding: 3rem; border-radius: 8px; border: 2px solid var(--success); width: 100%; box-sizing: border-box;}
        .end-screen h2 { color: var(--success); margin-bottom: 1rem; }

        .action-btn {
            background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 1rem;
            font-family: var(--font-family-mono); font-size: 1.05rem; cursor: pointer; border-radius: 6px; transition: 0.2s;
            margin-top: 1rem; font-weight: bold; width: 100%; box-sizing: border-box;
        }
        .action-btn:hover { background: var(--accent); color: var(--panel-bg); }
    </style>
</head>

        ];

        // --- UTILS ---
        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function normalize(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function generateCommonSenseHint(correctAnswer, stageIdx) {
            let words = correctAnswer.split(/[\s,()&]+/).filter(w => w.length > 3 && !['surface', 'process', 'bone', 'bone.', 'superior', 'inferior', 'lateral', 'medial', 'anterior', 'posterior'].includes(w.toLowerCase()));
            let keyTarget = words.length > 0 ? words[0] : correctAnswer.split(' ')[0];
            
            if (stageIdx === 0) return `Origins act as the stable anchor. Think about the bone or structure that doesn't move during contraction. The correct anchor involves the <strong>${keyTarget}</strong>.`;
            if (stageIdx === 1) return `Insertions are the moving attachment points. Think about what structure is being physically pulled. The target involves the <strong>${keyTarget}</strong>.`;
            if (stageIdx === 2) return `Muscles only pull, they never push. Based on its attachments, this muscle's main kinetic movement involves a <strong>${keyTarget}</strong> action.`;
        }

        // --- INITIALIZATION ---
        function buildNavBar() {
            const bar = document.getElementById('nav-bar');
            bar.innerHTML = '';
            
            // Inject "ALL" master section
            const btnAll = document.createElement('button');
            btnAll.className = 'back-btn';
            btnAll.innerText = 'ALL MUSCLES';
            btnAll.onclick = () => startSection('All');
            bar.appendChild(btnAll);

            sections.forEach(sec => {
                const btn = document.createElement('button');
                btn.className = 'back-btn';
                btn.innerText = sec.replace('Muscles of the ', '');
                btn.onclick = () => startSection(sec);
                bar.appendChild(btn);
            });
        }

        function startSection(sectionName) {
            currentSection = sectionName;
            document.querySelectorAll('.nav-bar .back-btn').forEach(btn => {
                let matchStr = sectionName === 'All' ? 'ALL MUSCLES' : sectionName.replace('Muscles of the ', '');
                btn.classList.toggle('active', btn.innerText === matchStr);
            });

            const filteredData = sectionName === 'All' ? rawData : rawData.filter(d => d.s === sectionName);
            mcqState = { deck: shuffle([...filteredData]), idx: 0, stage: 0, attempts: 0, correct: 0 };
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('target-area').style.display = 'flex';
            document.getElementById('header-tools').style.display = 'flex';

            loadCard();
        }

        function loadCard() {
            if (mcqState.idx >= mcqState.deck.length) {
                endSection();
                return;
            }

            mcqState.stage = 0;
            cardFailed = false;
            
            const currentMuscle = mcqState.deck[mcqState.idx];

            let displaySec = currentSection === 'All' ? "All Master Deck" : currentSection.replace('Muscles of the ', '');
            document.getElementById('prog-text').innerText = `${displaySec}: Muscle ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            
            document.getElementById('muscle-title').innerText = currentMuscle.m;
            document.getElementById('completion-msg').style.display = 'none';
            document.getElementById('next-card-btn').style.display = 'none';
            
            renderStage();
        }

        function renderStage() {
            lockBoard = false;
            document.getElementById('hint-display').style.display = 'none';
            document.getElementById('hint-btn').disabled = false;
            document.getElementById('chop-btn').disabled = false;
            document.getElementById('skip-stage-btn').disabled = false;
            document.getElementById('skip-muscle-btn').disabled = false;

            const stageInfo = stageMap[mcqState.stage];
            const currentMuscle = mcqState.deck[mcqState.idx];
            const correctAns = currentMuscle[stageInfo.key];

            const cardBox = document.getElementById('card-box');
            cardBox.className = `card-box stage-${mcqState.stage}`;
            document.getElementById('stage-badge').innerText = stageInfo.label;

            let usedNormals = new Set([normalize(correctAns)]);
            let options = [];
            
            // Pool dynamically selects ALL data if the section is 'All'
            let localPool = shuffle(currentSection === 'All' ? rawData : rawData.filter(d => d.s === currentSection));
            
            for (let m of localPool) {
                let val = m[stageInfo.key];
                let norm = normalize(val);
                if (!usedNormals.has(norm) && options.length < 5) {
                    options.push(val);
                    usedNormals.add(norm);
                }
            }

            // Fallback just in case a specific section was too small
            if (options.length < 5) {
                let globalPool = shuffle(rawData);
                for (let m of globalPool) {
                    let val = m[stageInfo.key];
                    let norm = normalize(val);
                    if (!usedNormals.has(norm) && options.length < 5) {
                        options.push(val);
                        usedNormals.add(norm);
                    }
                }
            }

            let finalOptions = options.map(text => ({ text: text, isCorrect: false }));
            finalOptions.push({ text: correctAns, isCorrect: true });
            finalOptions = shuffle(finalOptions);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            finalOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleGuess(btn, opt.isCorrect);
                grid.appendChild(btn);
            });
        }

        function handleGuess(btn, isCorrect) {
            if (lockBoard) return;
            
            document.getElementById('hint-btn').disabled = true;
            document.getElementById('chop-btn').disabled = true;
            document.getElementById('skip-stage-btn').disabled = true;
            document.getElementById('skip-muscle-btn').disabled = true;

            if (isCorrect) {
                lockBoard = true;
                btn.classList.add('correct');
                
                document.querySelectorAll('.opt-btn').forEach(b => {
                    if (b !== btn) b.classList.add('dimmed');
                    b.disabled = true;
                });

                setTimeout(() => {
                    mcqState.stage++;
                    if (mcqState.stage > 2) {
                        finishCard();
                    } else {
                        renderStage();
                    }
                }, 600);

            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                cardFailed = true;
            }
        }

        function useChop() {
            if (lockBoard) return;
            
            const grid = document.getElementById('options-grid');
            const allBtns = Array.from(grid.querySelectorAll('.opt-btn:not(.dimmed):not(.wrong)'));
            
            let correctBtn = null;
            let wrongBtns = [];
            
            const currentMuscle = mcqState.deck[mcqState.idx];
            const correctAns = currentMuscle[stageMap[mcqState.stage].key];

            allBtns.forEach(b => {
                if (b.innerText === correctAns) correctBtn = b;
                else wrongBtns.push(b);
            });

            wrongBtns = shuffle(wrongBtns);
            const keepWrongs = wrongBtns.slice(0, 2);
            
            allBtns.forEach(b => {
                if (b !== correctBtn && !keepWrongs.includes(b)) {
                    b.classList.add('dimmed');
                    b.disabled = true;
                }
            });

            document.getElementById('chop-btn').disabled = true;
        }

        function useHint() {
            if (lockBoard) return;
            cardFailed = true; 
            
            const currentMuscle = mcqState.deck[mcqState.idx];
            const correctAns = currentMuscle[stageMap[mcqState.stage].key];
            const hintText = generateCommonSenseHint(correctAns, mcqState.stage);

            document.getElementById('hint-display').innerHTML = `<strong>💡 Hint:</strong> ${hintText}`;
            document.getElementById('hint-display').style.display = 'block';
            document.getElementById('hint-btn').disabled = true;
        }

        function skipStage() {
            if (lockBoard) return;
            cardFailed = true;
            mcqState.stage++;
            if (mcqState.stage > 2) {
                finishCard();
            } else {
                renderStage();
            }
        }

        function skipMuscle() {
            if (lockBoard) return;
            cardFailed = true;
            lockBoard = true;
            finishCard();
        }

        function finishCard() {
            lockBoard = true;
            document.getElementById('hint-btn').disabled = true;
            document.getElementById('chop-btn').disabled = true;
            document.getElementById('skip-stage-btn').disabled = true;
            document.getElementById('skip-muscle-btn').disabled = true;

            mcqState.attempts++;
            const msg = document.getElementById('completion-msg');
            
            if (cardFailed) {
                mcqState.deck.push(mcqState.deck[mcqState.idx]);
                msg.innerHTML = `⚠️ Muscle Completed (with errors/tools/skips).<br><span style="font-size:0.9rem; font-weight:normal; color: var(--text-main);">Card recycled to the back of the deck for review.</span>`;
                msg.style.color = "var(--error)";
                msg.style.borderColor = "var(--error)";
                msg.style.backgroundColor = "rgba(224, 94, 117, 0.1)";
            } else {
                mcqState.correct++;
                msg.innerHTML = `✅ Muscle Mastered Flawlessly!`;
                msg.style.color = "var(--success)";
                msg.style.borderColor = "var(--success)";
                msg.style.backgroundColor = "rgba(140, 200, 75, 0.1)";
            }

            msg.style.display = 'block';
            document.getElementById('next-card-btn').style.display = 'block';
        }

        function advanceToNext() {
            mcqState.idx++;
            loadCard();
        }

        function endSection() {
            document.getElementById('target-area').style.display = 'none';
            document.getElementById('header-tools').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            const pct = Math.round((mcqState.correct / mcqState.attempts) * 100) || 0;
            document.getElementById('final-score').innerHTML = `You flawlessly identified the Origin, Insertion, and Action for <strong>${mcqState.correct}</strong> muscles out of <strong>${mcqState.attempts}</strong> total attempts (${pct}% accuracy).`;
        }

        // Boot
        buildNavBar();
        startSection('All');

    </script>
</body>
</html>
