            --text-main: #e0d0e3;

            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: var(--text-main); 
            font-family: sans-serif; 
        }
        svg { 
            width: 400px; 
            border: 1px dashed var(--text-muted); 
            background-color: var(--panel-bg); 
        }
        .interactive-layer { 
            transition: filter 0.3s ease; 
        }
        #origin-layer:hover, #insertion-layer:hover, #action-layer:hover {
            filter: url(#glow);
            cursor: pointer;
        }
