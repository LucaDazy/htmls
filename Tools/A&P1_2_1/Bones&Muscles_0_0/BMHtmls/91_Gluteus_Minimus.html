<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Preview: Gluteus Minimus</title>
    <style>
        :root {
            --bg-color: #221924;      
            --panel-bg: #3d1c60;      
            --accent: #a5689d;        
            --success: #4db6ac;
            --text-main: #e0d0e3;     
            --text-muted: #9c82a1;
        }
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: var(--text-main); 
            font-family: sans-serif; 
        }
        svg { 
            width: 350px; 
            border: 1px dashed var(--text-muted); 
            background-color: var(--panel-bg); 
        }
        .interactive-layer { 
            transition: filter 0.3s ease; 
        }
        #origin-layer:hover, #insertion-layer:hover, #action-layer:hover {
            filter: url(#glow);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Preview: Gluteus Minimus</h1>
    <p>SVG ID: <strong>muscle_gluteus_minimus</strong></p>
    <svg viewBox="0 80 300 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bone-shading" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="25%" stop-color="#f1f5f9" />
                <stop offset="75%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>
            <linearGradient id="muscle-shading" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#7f1d1d" />
                <stop offset="35%" stop-color="#ef4444" />
                <stop offset="80%" stop-color="#b91c1c" />
                <stop offset="100%" stop-color="#450a0a" />
            </linearGradient>
            <linearGradient id="tendon-shading" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#64748b" />
                <stop offset="50%" stop-color="#f8fafc" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
        
        <g class="svg-bg" fill="url(#bone-shading)" opacity="0.4">
            <path d="M 70,140 C 110,110 170,120 200,160 C 220,190 230,230 200,270 C 180,300 160,310 140,310 C 110,310 80,280 65,240 C 50,190 55,155 70,140 Z" />
            
            <path d="M 120,305 C 110,350 130,390 160,400 C 190,410 200,370 210,340 C 215,310 190,290 140,310" />
            
            <path d="M 195,165 C 230,190 260,230 250,290 C 240,330 210,360 190,370 L 210,260 Z" />
            
            <path d="M 150,290 C 165,280 175,300 155,315 L 125,335 L 135,550 C 135,570 105,570 105,550 L 95,350 C 70,340 65,300 85,305 C 110,310 130,305 150,290 Z" />
        </g>
        
        <g id="origin-layer" class="interactive-layer">
            <path d="M 80,185 C 115,160 160,180 175,215 C 155,245 110,250 80,225 C 65,210 65,195 80,185 Z" fill="var(--success)" />
        </g>
        
        <g id="action-layer" class="interactive-layer">
            <g id="action-belly">
                <path d="M 80,185 C 115,160 160,180 175,215 C 150,265 115,295 105,315 C 95,315 85,315 78,315 C 70,270 60,225 80,185 Z" fill="url(#muscle-shading)" />
                
                <g stroke="#450a0a" stroke-width="1.5" opacity="0.4" fill="none">
                    <path d="M 90,180 Q 90,250 85,315" />
                    <path d="M 115,175 Q 105,250 92,315" />
                    <path d="M 140,185 Q 120,250 98,315" />
                    <path d="M 160,200 Q 130,260 102,315" />
                    <path d="M 170,215 Q 135,270 106,315" />
                </g>
            </g>
            
            <g id="action-tendon">
                <path d="M 78,315 C 85,315 95,315 105,315 C 102,330 92,340 85,335 C 80,330 76,325 78,315 Z" fill="url(#tendon-shading)" />
                
                <path d="M 82,315 Q 85,325 83,332" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
                <path d="M 90,315 Q 92,325 90,335" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
                <path d="M 98,315 Q 99,325 96,332" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
            </g>
        </g>
        
        <g id="insertion-layer" class="interactive-layer">
            <ellipse cx="89" cy="326" rx="8" ry="5" transform="rotate(-15 89 326)" fill="var(--accent)" />
        </g>
    </svg>
</body>
</html>
