<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Preview: Flexor Carpi Ulnaris</title>
    <style>
        :root {
            --bg-color: #221924;      
            --panel-bg: #3d1c60;      
            --accent: #a5689d;        
            --success: #4db6ac;
            --text-main: #e0d0e3;     
            --text-muted: #9c82a1;
        }
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: var(--text-main); 
            font-family: sans-serif; 
        }
        svg { 
            width: 350px; 
            border: 1px dashed var(--text-muted); 
            background-color: var(--panel-bg); 
        }
        .interactive-layer { 
            transition: filter 0.3s ease; 
        }
        #origin-layer:hover, #insertion-layer:hover, #action-layer:hover {
            filter: url(#glow);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Preview: Flexor Carpi Ulnaris</h1>
    <p>SVG ID: <strong>muscle_flexor_carpi_ulnaris</strong></p>

                <stop offset="75%" stop-color="#cbd5e1" />
