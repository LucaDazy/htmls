<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Tables</title>
    <link rel="stylesheet" href="../../../Global/Css/main.css">
    <style>

        h1 {
            color: var(--minimal-white);
            font-family: var(--font-family-display);
            font-size: 3rem;
            margin-bottom: 1rem; /* Tighter spacing */
            text-align: center;
        }

        .tool-container {
            width: 100%; max-width: 600px; display: flex; flex-direction: column; 
            align-items: center; gap: 1.5rem; position: relative;
        }

        .target-box {
            background: var(--panel-bg); border-radius: 8px;
            padding: 1.5rem 2rem;
            display: flex; flex-direction: column; width: 100%; box-sizing: border-box; align-items: center;
        }
        
        .header-row {
            display: flex; justify-content: flex-end; align-items: center; width: 100%;
            border-bottom: 1px dashed var(--hover-bg); padding-bottom: 1rem; margin-bottom: 2rem;
        }

        .progress-text { font-family: var(--font-family-mono); font-size: 0.95rem; color: var(--text-muted); font-weight: bold; }

        .rules-blurb {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            background: var(--hover-bg);
            padding: 0.75rem;
            border-radius: 4px;
            margin-top: -1rem;
            margin-bottom: 1.5rem;
        }

        .equation {
            font-size: 4rem;
            color: var(--text-main);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .equation span {
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            width: 300px;
            display: flex;
            justify-content: center;
        }

        input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: var(--font-family-mono);
            font-size: 3rem;
            text-align: center;
            width: 100%;
            outline: none;
            caret-color: var(--accent);
        }

        /* Hide arrows from number input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .feedback {
            margin-top: 1rem;
            height: 2rem;
            font-size: 1.2rem;
            color: var(--error);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .feedback.visible {
            opacity: 1;
        }
        
        .end-screen { text-align: center; display: none; background: var(--panel-bg); padding: 3rem; border-radius: 8px; border: 2px solid var(--success); width: 100%; box-sizing: border-box;}
        .end-screen h2 { color: var(--success); margin-bottom: 1rem; }

        .action-btn {
            background: transparent; border: 2px solid var(--accent); color: var(--accent);
            font-family: var(--font-family-mono); font-size: 1rem; cursor: pointer; border-radius: 4px; width: 100%;
            font-weight: bold; text-align: center; padding: 1rem 1.5rem;
        }
        .action-btn:hover { background: var(--accent); color: var(--bg-color); }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <img src="../../../Global/SVGs/logo.svg" alt="Study Hub Logo" class="corner-logo">
    <img src="../../../Global/SVGs/avatar.svg" alt="Avatar" class="corner-avatar">
    
    <div class="content-wrapper">
        <h1>Multiplication Trainer</h1>

        <div class="tool-container">
            <div class="target-box" id="gameUI">
                <div class="header-row">
                    <div class="progress-text" id="progText">Remaining: 0</div>
                </div>

                <div class="rules-blurb">
                    excluded: multipliers of 1, 2, 10 <br>
                    multipliers of 11 (except 11x11, 11x12, 12x11)<br>
                    specific exclusions: 5x3, 5x4, 5x5
                </div>

                <div class="equation" id="equationDisplay">Loading...</div>
                
                <div class="input-wrapper">
                    <input type="number" id="answerInput" autocomplete="off" autofocus>
                </div>
        
                <div class="feedback" id="feedbackMsg">Wrong, the answer is 0</div>
            </div>

            <div class="end-screen" id="winScreen">
                <h2>Stack Cleared</h2>
                <button class="action-btn" onclick="location.reload()">Restart</button>
            </div>
        </div>
    </div>

    <script>
        // --- Game State ---
        let questionStack = [];
        let currentQuestion = null;
        let isErrorState = false; // Is the user currently looking at an error they need to correct?

        const equationDisplay = document.getElementById('equationDisplay');
        const answerInput = document.getElementById('answerInput');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const progText = document.getElementById('progText');
        const gameUI = document.getElementById('gameUI');
        const winScreen = document.getElementById('winScreen');

        // --- Initialization ---
        function init() {
            generateQuestions();
            shuffleStack();
            updateCounter();
            nextQuestion();
            
            // Focus safeguard
            document.addEventListener('click', () => answerInput.focus());
        }

        // --- Logic ---
        function generateQuestions() {
            // We want numbers up to 12
            for (let i = 1; i <= 12; i++) {
                for (let j = 1; j <= 12; j++) {
                    
                    // 1. Do not include anything multiplied with 2
                    if (i === 2 || j === 2) continue;

                    // 2. Do not include anything multiplied with 1
                    if (i === 1 || j === 1) continue;

                    // 3. Do not include anything multiplied with 10
                    if (i === 10 || j === 10) continue;

                    // 4. Do not include anything multiplied with 11
                    // (except for 11*11 and 11*12 and 12*11)
                    if (i === 11 || j === 11) {
                        const isException = (i === 11 && j === 11) || 
                                            (i === 11 && j === 12) || 
                                            (i === 12 && j === 11);
                        if (!isException) continue;
                    }

                    // 5. Specific exclusions: 5*3, 5*4, 5*5
                    if (i === 5 && (j === 3 || j === 4 || j === 5)) continue;

                    // Add to stack
                    questionStack.push({
                        a: i,
                        b: j,
                        ans: i * j
                    });
                }
            }
        }

        function shuffleStack() {
            for (let i = questionStack.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questionStack[i], questionStack[j]] = [questionStack[j], questionStack[i]];
            }
        }

        function updateCounter() {
            // If we are in error state, the current question is technically 
            // 'active' but also 're-queued' mentally. 
            // We just show the length of the stack waiting.
            progText.innerText = 'Remaining: ' + (questionStack.length + (currentQuestion ? 1 : 0));
        }

        function nextQuestion() {
            if (questionStack.length === 0) {
                gameCompleted();
                return;
            }

            // Pop the next question
            currentQuestion = questionStack.shift();
            
            // Render
            equationDisplay.innerHTML = `${currentQuestion.a} <span>x</span> ${currentQuestion.b}`;
            answerInput.value = '';
            feedbackMsg.classList.remove('visible');
            isErrorState = false;
            updateCounter();
        }

        function gameCompleted() {
            gameUI.style.display = 'none';
            winScreen.style.display = 'flex';
            progText.innerText = 'Remaining: 0';
        }

        function handleWrongAnswer() {
            // Show feedback
            feedbackMsg.innerText = `Wrong, the answer is ${currentQuestion.ans}`;
            feedbackMsg.classList.add('visible');
            
            // Add back to stack (at a random position or end? "add itself back to the stack")
            // To ensure it doesn't just immediately pop up again if the stack is small, 
            // we insert it at a random position, but generally towards the back is better for memory.
            // Let's just push to end for simplicity, or splice randomly.
            // Random insertion prevents predictable loops.
            const randomIndex = Math.floor(Math.random() * questionStack.length);
            questionStack.splice(randomIndex, 0, currentQuestion);

            isErrorState = true;
            answerInput.value = ''; // clear input so they have to type the correct one
            updateCounter();
        }

        // --- Event Listeners ---
        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(answerInput.value);

                if (isNaN(val)) return;

                if (isErrorState) {
                    // If we are in error state, user MUST type correct answer to proceed
                    if (val === currentQuestion.ans) {
                        // They typed the correction. Now we move on.
                        // Note: The question was ALREADY added back to the stack in handleWrongAnswer.
                        nextQuestion(); 
                    } else {
                        // They got it wrong AGAIN while trying to correct it.
                        // Just keep the message there, maybe flash it.
                        feedbackMsg.style.animation = "none";
                        feedbackMsg.offsetHeight; /* trigger reflow */
                        feedbackMsg.style.animation = "shake 0.5s"; 
                        answerInput.value = '';
                    }
                } else {
                    // Normal attempt
                    if (val === currentQuestion.ans) {
                        // Correct!
                        nextQuestion();
                    } else {
                        // Wrong!
                        handleWrongAnswer();
                    }
                }
            }
        });

        // Start
        init();

    </script>
    <script src="../../../Global/Scripts/background-animation.js" data-base-path="../../../"></script>
</body>
</html>
