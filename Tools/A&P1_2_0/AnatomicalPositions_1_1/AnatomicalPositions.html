    <link rel="stylesheet" href="../../../Global/Css/main.css">

    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
        }

        h1 { color: var(--accent); margin-bottom: 0.5rem; text-align: center; font-family: var(--font-family-display); }

        .container {
            width: 100%; max-width: 1300px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
        }

        /* Top Target Box */
        .target-box {
            background: var(--panel-bg); border: 2px solid var(--accent); border-radius: 8px;
            padding: 1.5rem 2rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;
        }

        .header-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            border-bottom: 1px dashed var(--text-muted); padding-bottom: 0.8rem; margin-bottom: 1.5rem;
        }

        .progress-text { font-size: 0.95rem; color: var(--text-muted); font-weight: bold; }

        .hint-btn {
            background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);
            padding: 0.4rem 0.8rem; font-family: var(--font-family-mono); font-size: 0.9rem; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .hint-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(165, 104, 157, 0.1); }
        .hint-btn:disabled { opacity: 0.5; cursor: default; }

        .target-clue { font-size: 1.4rem; line-height: 1.6; color: var(--text-main); margin-bottom: 0.5rem; width: 100%; }
        .target-clue strong { color: var(--accent); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 1px; }

        /* SVG Dissection Arena */
        .svg-arena {
            width: 100%; background: #18191a; border-radius: 8px; border: 1px solid var(--text-muted);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8); overflow: hidden; position: relative;
        }

        svg { width: 100%; height: auto; display: block; }

        /* SVG Interactive Elements */
        .organ-group { cursor: pointer; pointer-events: all; }
        
        .organ-shape { transition: filter 0.2s ease-in-out, fill 0.2s ease-in-out, stroke 0.2s, opacity 0.2s; opacity: 0.25; }
        .pin-line { fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 2.5; transition: stroke 0.2s; }
        .pin-head { stroke: #222; stroke-width: 2; transition: fill 0.2s; }
        .pin-dot { fill: rgba(255,255,255,0.8); pointer-events: none; }

        /* JS Synced Hover States (Replaces CSS :hover to fix Z-Order Sync) */
        .organ-group.is-hovered .organ-shape { opacity: 0.9; filter: drop-shadow(0 0 6px rgba(165, 104, 157, 0.6)); fill: var(--accent); }
        .organ-group.is-hovered .pin-line { stroke: var(--accent); stroke-width: 3.5; }
        .organ-group.is-hovered .pin-head { fill: var(--accent); }

        /* Game States */
        .organ-group.dimmed { opacity: 0.15; pointer-events: none; }
        .organ-group.correct .organ-shape { opacity: 0.9; fill: var(--success) !important; filter: drop-shadow(0 0 10px rgba(77, 182, 172, 0.6)); }
        .organ-group.correct .pin-head { fill: var(--success); }
        .organ-group.wrong .organ-shape { opacity: 0.9; fill: var(--error) !important; filter: drop-shadow(0 0 10px rgba(224, 94, 117, 0.6)); }
        .organ-group.wrong .pin-head { fill: var(--error); }
        
        /* Feedback Box */
        .feedback-box {
            margin-top: 1rem; padding: 1.2rem; border-radius: 4px; display: none; line-height: 1.5; font-size: 1.05rem;
            background: rgba(0,0,0,0.2); border-left: 4px solid var(--accent); width: 100%; text-align: left; box-sizing: border-box;
        }

        .action-btn {
            background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 1rem 1.5rem;
            font-family: var(--font-family-mono); font-size: 1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; width: 100%;
            margin-top: 1.5rem; font-weight: bold; display: none;
        }
        .action-btn:hover { background: var(--accent); color: var(--bg-color); }

        .end-screen { text-align: center; display: none; background: var(--panel-bg); padding: 3rem; border-radius: 8px; border: 2px solid var(--success); width: 100%; box-sizing: border-box;}
        .end-screen h2 { color: var(--success); margin-bottom: 1rem; }

    </style>
</head>

        <div id="end-screen" class="end-screen">
            <h2>Anatomy Mastered!</h2>
            <p id="final-score" style="margin-bottom: 2rem; color: var(--text-main); font-size:1.1rem;"></p>
            <button class="action-btn" style="display:block;" onclick="init()">Restart Drill</button>
        </div>

    </div>

    <script src="../../../Global/Scripts/background-animation.js" data-base-path="../../../"></script>
    <script>
        // --- DATA DECK ---
        const structures = [
            { id: "frontal", name: "Frontal (forehead)", exp: "The anterior portion of the skull/head." },
            { id: "orbital", name: "Orbital (eye)", exp: "The bony socket that houses the eye." },
            { id: "nasal", name: "Nasal (nose)", exp: "The region of the nose." },
            { id: "buccal", name: "Buccal (cheek)", exp: "The fleshy portion of either side of the face." },
            { id: "oral", name: "Oral (mouth)", exp: "The region of the mouth." },
            { id: "mental", name: "Mental (chin)", exp: "The anterior point of the lower jaw." },
            { id: "cervical", name: "Cervical (neck)", exp: "The neck region connecting head to trunk." },
            { id: "sternal", name: "Sternal (breastbone)", exp: "The medial region of the anterior thorax." },
            { id: "axillary", name: "Axillary (armpit)", exp: "The junction of the arm and thorax." },
            { id: "mammary", name: "Mammary (breast)", exp: "The glandular region of the chest." },
            { id: "umbilical", name: "Umbilical (navel)", exp: "The central abdominal region (belly button)." },
            { id: "pelvic", name: "Pelvic (pelvis)", exp: "The area overlying the pelvis anteriorly." },
            { id: "coxal", name: "Coxal (hip)", exp: "The lateral pelvic region (hip)." },
            { id: "inguinal", name: "Inguinal (groin)", exp: "The crease where the thigh meets the trunk." },
            { id: "pubic", name: "Pubic (genital)", exp: "The anterior region of the pelvis." },
            { id: "acromial", name: "Acromial (point of shoulder)", exp: "The superior, lateral point of the shoulder." },
            { id: "brachial", name: "Brachial (arm)", exp: "The upper arm, between shoulder and elbow." },
            { id: "antecubital", name: "Antecubital (front of elbow)", exp: "The anterior crease of the elbow." },
            { id: "antebrachial", name: "Antebrachial (forearm)", exp: "The lower arm, between elbow and wrist." },
            { id: "carpal", name: "Carpal (wrist)", exp: "The joint connecting forearm to hand." },
            { id: "palmar", name: "Palmar (palm)", exp: "The anterior surface of the hand." },
            { id: "pollex", name: "Pollex (thumb)", exp: "Digit 1 of the hand." },
            { id: "digital_hand", name: "Digital (fingers)", exp: "The phalanges of the hand." },
            { id: "femoral", name: "Femoral (thigh)", exp: "The upper leg, between hip and knee." },
            { id: "patellar", name: "Patellar (anterior knee)", exp: "The kneecap region." },
            { id: "crural", name: "Crural (leg)", exp: "The lower leg (shin), between knee and ankle." },
            { id: "fibular", name: "Fibular or peroneal (side of leg)", exp: "The lateral portion of the lower leg." },
            { id: "tarsal", name: "Tarsal (ankle)", exp: "The joint connecting leg to foot." },
            { id: "metatarsal", name: "Metatarsal (top of foot)", exp: "The superior (dorsal) surface of the foot." },
            { id: "digital_foot", name: "Digital (toes)", exp: "The phalanges of the foot." },
            { id: "hallux", name: "Hallux (great toe)", exp: "Digit 1 of the foot." },
            { id: "otic", name: "Otic (ear)", exp: "The lateral region of the head." },
            { id: "occipital", name: "Occipital (back of head or base of skull)", exp: "The posterior, inferior portion of the skull." },
            { id: "scapular", name: "Scapular (shoulder blade)", exp: "The posterior shoulder region." },
            { id: "vertebral", name: "Vertebral (spinal column)", exp: "The medial region of the back following the spine." },
            { id: "lumbar", name: "Lumbar (loin)", exp: "The lower back, between ribs and hips." },
            { id: "sacral", name: "Sacral (between hips)", exp: "The posterior region between the hip bones." },
            { id: "gluteal", name: "Gluteal (buttock)", exp: "The fleshy posterior pelvic region." },
            { id: "perineal", name: "Perineal (region between anus and genitalia)", exp: "The diamond-shaped region on the inferior pelvis." },
            { id: "olecranal", name: "Olecranal (back of elbow)", exp: "The posterior aspect of the elbow joint." },
            { id: "metacarpal", name: "Metacarpal (back of hand)", exp: "The posterior (dorsal) surface of the hand." },
            { id: "popliteal", name: "Popliteal (back of knee)", exp: "The posterior crease of the knee." },
            { id: "sural", name: "Sural (calf)", exp: "The posterior muscular portion of the lower leg." },
            { id: "calcaneal", name: "Calcaneal (heel)", exp: "The posterior point of the foot." },
            { id: "plantar", name: "Plantar (sole)", exp: "The inferior surface of the foot." }
        ];

        // --- ENGINE STATE ---
        let mcqState = { deck: [], idx: 0, attempts: 0, correct: 0 };
        let hintUsed = false;
        let lockBoard = false;

        // --- UTILS ---
        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // --- Z-ORDER SEPARATION SCRIPT ---
        // Dynamically forces pins to the absolute top of the SVG to prevent region overlapping issues.
        function setupSVG() {
            const svgArena = document.querySelector('svg');
            
            if (!document.getElementById('pins-layer')) {
                const pinsLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
                pinsLayer.setAttribute("id", "pins-layer");
                svgArena.appendChild(pinsLayer);

                const allOriginalGroups = Array.from(document.querySelectorAll('.organ-group'));
                
                // Extract pins and move to top layer
                allOriginalGroups.forEach(group => {
                    const id = group.dataset.id;
                    const pinGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    pinGroup.setAttribute("class", "organ-group");
                    pinGroup.setAttribute("data-id", id);
                    
                    group.querySelectorAll('.pin-line, .pin-head, .pin-dot').forEach(el => {
                        pinGroup.appendChild(el);
                    });
                    
                    pinsLayer.appendChild(pinGroup);
                });
            }

            // Sync Hover & Click States across separated layers
            document.querySelectorAll('.organ-group').forEach(group => {
                const id = group.dataset.id;
                
                group.addEventListener('mouseenter', () => {
                    if (lockBoard || group.classList.contains('locked') || group.classList.contains('dimmed')) return;
                    document.querySelectorAll(`.organ-group[data-id="${id}"]`).forEach(p => p.classList.add('is-hovered'));
                });
                
                group.addEventListener('mouseleave', () => {
                    document.querySelectorAll(`.organ-group[data-id="${id}"]`).forEach(p => p.classList.remove('is-hovered'));
                });
                
                group.classList.remove('correct', 'wrong', 'dimmed', 'locked', 'is-hovered');
                
                group.onclick = () => {
                    if (!lockBoard && !group.classList.contains('locked') && !group.classList.contains('dimmed')) {
                        handleGuess(id);
                    }
                };
            });
        }

        function init() {
            mcqState = { deck: shuffle([...structures]), idx: 0, attempts: 0, correct: 0 };
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('svg-arena').style.display = 'block';
            document.getElementById('target-area').style.display = 'flex';

            setupSVG();
            loadCard();
        }

        function loadCard() {
            if (mcqState.idx >= mcqState.deck.length) {
                endDrill();
                return;
            }

            lockBoard = false;
            hintUsed = false;
            
            const currentCard = mcqState.deck[mcqState.idx];

            document.getElementById('clue-text').innerText = currentCard.name;
            document.getElementById('prog-text').innerText = `Region ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('hint-btn').disabled = false;
            
            document.querySelectorAll('.organ-group').forEach(group => {
                group.classList.remove('correct', 'wrong', 'dimmed', 'locked', 'is-hovered');
            });
        }

        function handleGuess(clickedId) {
            if (lockBoard) return;
            lockBoard = true;
            document.getElementById('hint-btn').disabled = true;

            const currentCard = mcqState.deck[mcqState.idx];
            const fb = document.getElementById('feedback');
            const allGroups = document.querySelectorAll('.organ-group');
            
            mcqState.attempts++;
            
            const isCorrect = (clickedId === currentCard.id);
            const clickedGroups = document.querySelectorAll(`.organ-group[data-id="${clickedId}"]`);

            if (isCorrect) {
                clickedGroups.forEach(g => g.classList.add('correct'));
                
                if (hintUsed) {
                    mcqState.deck.push(mcqState.deck[mcqState.idx]); // Recycle
                    fb.innerHTML = `<strong style="color:var(--success);">✅ Correct (Hint Used).</strong><br><br>${currentCard.exp}<br><br><em style="color:var(--accent);">Card recycled to the back of the deck.</em>`;
                    fb.style.borderLeftColor = 'var(--success)';
                } else {
                    mcqState.correct++;
                    fb.innerHTML = `<strong style="color:var(--success);">✅ Correct!</strong><br><br>${currentCard.exp}`;
                    fb.style.borderLeftColor = 'var(--success)';
                }
            } else {
                clickedGroups.forEach(g => g.classList.add('wrong'));
                mcqState.deck.push(mcqState.deck[mcqState.idx]); // Recycle
                
                const clickedObj = structures.find(s => s.id === clickedId);
                const actualName = clickedObj ? clickedObj.name : "an incorrect region";

                // Show them where it actually is
                document.querySelectorAll(`.organ-group[data-id="${currentCard.id}"]`).forEach(g => g.classList.add('correct'));

                let prefix = hintUsed ? `<strong style="color:var(--error);">❌ Incorrect (Hint Used).</strong>` : `<strong style="color:var(--error);">❌ Incorrect.</strong>`;
                fb.innerHTML = `${prefix}<br><br>You clicked the <strong>${actualName}</strong>.<br>The correct location for the <strong>${currentCard.name}</strong> is highlighted in green.<br><br><em style="color:var(--accent);">Card recycled to the back of the deck.</em>`;
                fb.style.borderLeftColor = 'var(--error)';
            }
            
            allGroups.forEach(g => {
                g.classList.add('locked'); 
                if (!g.classList.contains('correct') && !g.classList.contains('wrong')) {
                    g.classList.add('dimmed');
                }
            });

            document.getElementById('prog-text').innerText = `Region ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            fb.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function useHint() {
            if (lockBoard || hintUsed) return;
            hintUsed = true;
            
            const currentCard = mcqState.deck[mcqState.idx];
            const allIds = structures.map(s => s.id);
            const wrongIds = shuffle(allIds.filter(id => id !== currentCard.id));
            
            // Keep correct and 3 random wrong active
            const keepActiveIds = [currentCard.id, wrongIds[0], wrongIds[1], wrongIds[2]];
            
            document.querySelectorAll('.organ-group').forEach(g => {
                if (!keepActiveIds.includes(g.dataset.id)) {
                    g.classList.add('dimmed');
                    g.classList.add('locked');
                }
            });
            
            document.getElementById('hint-btn').disabled = true;
        }

        function nextCard() {
            mcqState.idx++;
            loadCard();
        }

        function endDrill() {
            document.getElementById('target-area').style.display = 'none';
            document.getElementById('svg-arena').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            const pct = Math.round((mcqState.correct / mcqState.attempts) * 100) || 0;
            document.getElementById('final-score').innerHTML = `You correctly identified <strong>${mcqState.correct}</strong> regions without hints on the first try out of <strong>${mcqState.attempts}</strong> total attempts (${pct}% accuracy).`;
        }

        // Boot
        init();

    </script>
