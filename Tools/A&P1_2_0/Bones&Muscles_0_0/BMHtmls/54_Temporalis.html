<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Preview: Temporalis</title>
    <style>
        :root { /* Colors from the main project's CSS */
            --bg-color: #221924;      
            --panel-bg: #3d1c60;      
            --accent: #a5689d;        
            --success: #4db6ac;
            --text-main: #e0d0e3;     
            --text-muted: #9c82a1;
        }
        body { background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: var(--text-main); font-family: sans-serif; }
        svg { width: 400px; border: 1px dashed var(--text-muted); background-color: var(--panel-bg); }
        .interactive-layer { transition: filter 0.3s ease; }
        #origin-layer:hover, #insertion-layer:hover, #action-layer:hover, #region-layer:hover, #landmarks-layer:hover {
            filter: url(#glow);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Preview: Temporalis</h1>
    <p>SVG ID: <strong>muscle_temporalis</strong></p>
    <svg viewBox="20 20 360 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bone-shading" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#94a3b8" /><stop offset="25%" stop-color="#f1f5f9" /><stop offset="75%" stop-color="#cbd5e1" /><stop offset="100%" stop-color="#475569" /></linearGradient>
            <linearGradient id="muscle-shading" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7f1d1d" /><stop offset="35%" stop-color="#ef4444" /><stop offset="80%" stop-color="#b91c1c" /><stop offset="100%" stop-color="#450a0a" /></linearGradient>
            <linearGradient id="tendon-shading" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#64748b" /><stop offset="50%" stop-color="#f8fafc" /><stop offset="100%" stop-color="#334155" /></linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
        </defs>
        
        <g class="svg-bg" fill="url(#bone-shading)" opacity="0.4">
            <path d="M 200,50 C 100,50 70,140 80,220 C 80,250 85,290 110,310 L 140,310 C 150,290 150,260 140,240 L 170,240 C 190,240 210,250 220,270 C 240,280 270,260 310,220 C 330,150 320,50 200,50 Z"/>
            
            <path d="M 95,160 C 95,140 120,135 130,150 C 140,170 110,190 100,180 C 95,175 95,165 95,160 Z" fill="var(--bg-color)" />

            <path d="M 85,220 L 75,260 C 75,270 95,270 100,260 Z" fill="var(--bg-color)" />

            <circle cx="275" cy="265" r="7" fill="var(--bg-color)" />

            <path d="M 285,275 C 295,305 305,315 285,335 C 265,305 275,285 265,275 Z" />

            <path d="M 170,55 Q 160,110 115,140" fill="none" stroke="var(--bg-color)" stroke-width="2" />
            <path d="M 115,140 Q 200,100 270,180" fill="none" stroke="var(--bg-color)" stroke-width="2" />

            <path d="M 120,360 C 110,400 140,430 180,430 C 220,430 260,390 270,310 L 250,270 L 230,290 L 195,240 L 175,290 C 150,330 130,340 120,360 Z"/>

            <path d="M 95,230 Q 180,200 280,240 L 280,255 Q 180,215 95,245 Z" fill="url(#bone-shading)" />
        </g>
        
        <g id="origin-layer" class="interactive-layer">
            <path d="M 115,140 C 120,60 190,40 265,65 C 315,85 325,160 305,225 L 290,220 C 310,160 300,95 255,75 C 190,55 130,75 125,145 Z" fill="var(--success)" />
        </g>
        
        <g id="action-layer" class="interactive-layer">
            <g id="action-belly">
                <path d="M 115,140 C 120,70 190,50 260,70 C 310,90 315,160 300,220 C 280,260 230,255 210,240 L 195,240 L 180,240 C 150,235 120,195 115,140 Z" fill="url(#muscle-shading)" />
            </g>
            
            <g id="action-tendon">
                <g stroke="#450a0a" stroke-width="1.5" opacity="0.5" fill="none">
                    <path d="M 130,140 Q 150,210 180,235" />
                    <path d="M 155,100 Q 170,200 185,235" />
                    <path d="M 190,75 Q 190,190 192,235" />
                    <path d="M 230,75 Q 210,190 198,235" />
                    <path d="M 265,100 Q 230,190 203,235" />
                    <path d="M 295,145 Q 245,205 208,235" />
                    <path d="M 305,190 Q 255,220 212,235" />
                </g>
                <path d="M 175,230 C 185,255 190,265 195,275 C 200,265 205,255 215,230 C 200,245 190,245 175,230 Z" fill="url(#tendon-shading)" />
            </g>
        </g>
        
        <g id="insertion-layer" class="interactive-layer">
            <path d="M 185,245 L 195,235 L 205,245 L 195,265 Z" fill="var(--accent)" />
            <circle cx="195" cy="250" r="5" fill="var(--accent)" />
        </g>
    </svg>
</body>
</html>
