<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Preview: Sternum</title>
    <style>
        :root { 
            --bg-color: #221924;      
            --panel-bg: #3d1c60;      
            --accent: #a5689d;        
            --success: #4db6ac;
            --text-main: #e0d0e3;     
            --text-muted: #9c82a1;
        }
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: var(--text-main); 
            font-family: sans-serif; 
            margin: 0;
            padding: 20px;
        }
        svg { 
            width: 450px; 
            max-width: 100%;
            border: 1px dashed var(--text-muted); 
            background-color: var(--panel-bg); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 15px;
        }
        .info-panel {
            text-align: center;
            max-width: 650px;
            background: rgba(0,0,0,0.2);
            padding: 15px 25px;
            border-radius: 8px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .info-panel strong {
            color: var(--text-main);
        }
        .interactive-layer { 
            transition: filter 0.3s ease; 
        }
        #region-layer:hover, #landmarks-layer:hover {
            filter: url(#glow);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Preview: Sternum</h1>
    
    <div class="info-panel">
        <p>SVG ID: <strong>bone_sternum</strong></p>
        <p>Region: <strong>Axial (Thoracic Cage)</strong></p>
        <p>Landmarks: <strong>Manubrium, body, xiphoid process</strong></p>
        <p><em>Note: Visualized from an anterior view, highlighting its three major segments and articulation points with the clavicles and costal cartilages.</em></p>
    </div>
    
    <svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bone-shading" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#94a3b8" /><stop offset="25%" stop-color="#f1f5f9" /><stop offset="75%" stop-color="#cbd5e1" /><stop offset="100%" stop-color="#475569" /></linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
        </defs>
        
        <g class="svg-bg" fill="url(#bone-shading)" opacity="0.4">
            <path d="M 155,75 C 100,60 50,70 30,80 L 30,100 C 60,90 100,80 150,95 Z" />
            <path d="M 245,75 C 300,60 350,70 370,80 L 370,100 C 340,90 300,80 250,95 Z" />
            
            <path d="M 160,105 L 90,110 L 85,130 L 165,115 Z" /> <path d="M 175,130 L 95,145 L 90,165 L 170,145 Z" /> <path d="M 173,170 L 85,190 L 80,210 L 170,185 Z" /> <path d="M 171,215 L 75,240 L 70,260 L 168,230 Z" /> <path d="M 172,260 L 65,290 L 60,310 L 170,275 Z" /> <path d="M 175,300 L 65,340 L 60,360 L 175,310 Z" /> <path d="M 185,320 L 75,390 L 70,410 L 190,330 Z" /> <path d="M 240,105 L 310,110 L 315,130 L 235,115 Z" /> <path d="M 225,130 L 305,145 L 310,165 L 230,145 Z" /> <path d="M 227,170 L 315,190 L 320,210 L 230,185 Z" /> <path d="M 229,215 L 325,240 L 330,260 L 232,230 Z" /> <path d="M 228,260 L 335,290 L 340,310 L 230,275 Z" /> <path d="M 225,300 L 335,340 L 340,360 L 225,310 Z" /> <path d="M 215,320 L 325,390 L 330,410 L 210,330 Z" /> </g>
        
        <g id="region-layer" class="interactive-layer">
            <path d="M 180,80 
                     C 190,95 210,95 220,80 
                     L 245,75 
                     L 235,110 
                     L 225,130 
                     L 175,130 
                     L 165,110 
                     L 155,75 Z" 
                  fill="url(#bone-shading)" />
                  
            <path d="M 175,135 
                     L 225,135 
                     C 230,170 235,210 228,300 
                     L 210,320 
                     L 190,320 
                     L 172,300 
                     C 165,210 170,170 175,135 Z" 
                  fill="url(#bone-shading)" />
                  
            <path d="M 190,325 
                     L 210,325 
                     L 205,355 
                     L 200,375 
                     L 195,355 Z" 
                  fill="url(#bone-shading)" />
                  
            <g stroke="#475569" stroke-width="2" opacity="0.4" fill="none">
                <path d="M 173,180 Q 200,185 227,180" />
                <path d="M 171,225 Q 200,230 229,225" />
                <path d="M 170,270 Q 200,275 230,270" />
            </g>
        </g>
        
        <g id="landmarks-layer" class="interactive-layer">
            <circle cx="200" cy="105" r="7" fill="var(--accent)" />
            
            <circle cx="200" cy="225" r="7" fill="var(--accent)" />
            
            <circle cx="200" cy="345" r="5" fill="var(--accent)" />
        </g>
        
    </svg>
</body>
</html>
