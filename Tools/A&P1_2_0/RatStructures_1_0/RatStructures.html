<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Rat Dissection</title>
    <link rel="stylesheet" href="../../../Global/Css/main.css">
    <link rel="stylesheet" href="../../../Global/Css/animations.css">
    <style>
        /* Tool-specific overrides and styles */
        h1 {
            color: var(--minimal-white);
            font-family: var(--font-family-display);
            font-size: 3rem; /* Larger, more impactful title */
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-family: var(--font-family-main);
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-align: center;
        }

        .tool-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .target-box {
            background: var(--panel-bg);
            border: none; /* The panel provides enough separation */
            border-radius: 8px;
            padding: 1.5rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px dashed var(--hover-bg); /* Use theme color */
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .progress-text { font-size: 0.95rem; color: var(--text-muted); font-family: var(--font-family-mono); font-weight: bold; }

        .hint-btn {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all var(--anim-duration-fast) var(--anim-easing);
        }
        .hint-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--hover-bg); }
        .hint-btn:disabled { opacity: 0.5; cursor: default; }

        .target-clue { font-size: 1.4rem; line-height: 1.6; color: var(--text-main); margin-bottom: 0.5rem; width: 100%; }
        .target-clue strong { color: var(--accent); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 1px; }

        .svg-arena {
            width: 100%;
            background: #18191a; /* A dark, neutral slate for the dissection itself */
            border-radius: 8px;
            border: 1px solid var(--hover-bg);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
        }

        svg { width: 100%; height: auto; display: block; }

        .organ-group { cursor: pointer; pointer-events: all; }
        .organ-shape { transition: filter 0.2s ease-in-out, fill 0.2s ease-in-out; }
        .pin-line { fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 2.5; transition: stroke 0.2s; }
        .pin-head { stroke: #222; stroke-width: 2; transition: fill 0.2s; }
        .pin-dot { fill: rgba(255,255,255,0.8); pointer-events: none; }

        .organ-group:hover:not(.locked):not(.dimmed) .organ-shape { filter: brightness(1.4) drop-shadow(0 0 6px rgba(255,255,255,0.4)); }
        .organ-group:hover:not(.locked):not(.dimmed) .pin-line { stroke: var(--accent); stroke-width: 3.5; }
        .organ-group:hover:not(.locked):not(.dimmed) .pin-head { fill: var(--accent); }

        .organ-group.dimmed { opacity: 0.15; pointer-events: none; }
        .organ-group.correct .organ-shape { fill: var(--success) !important; filter: brightness(1.2) drop-shadow(0 0 10px var(--success)); stroke: var(--success) !important; }
        .organ-group.correct .pin-head { fill: var(--success); }
        .organ-group.wrong .organ-shape { fill: var(--error) !important; filter: brightness(1.2); }
        .organ-group.wrong .pin-head { fill: var(--error); }
        
        .feedback-box {
            margin-top: 1rem;
            padding: 1.2rem;
            border-radius: 4px;
            display: none;
            line-height: 1.5;
            font-size: 1.05rem;
            background: var(--hover-bg); /* Themed background */
            border-left: 4px solid var(--accent);
            width: 100%;
            text-align: left;
            box-sizing: border-box;
        }

        .action-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 1rem 1.5rem;
            font-family: var(--font-family-mono);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all var(--anim-duration-fast) var(--anim-easing);
            width: 100%;
            margin-top: 1.5rem;
            font-weight: bold;
            display: none;
        }
        .action-btn:hover { background: var(--accent); color: var(--bg-color); }

        .end-screen {
            text-align: center;
            display: none;
            background: var(--panel-bg);
            padding: 3rem;
            border-radius: 8px;
            border: 2px solid var(--success);
            width: 100%;
            box-sizing: border-box;
        }
        .end-screen h2 { color: var(--success); margin-bottom: 1rem; }

        .drop-shadow { filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); }
    </style>
</head>

    <script>
        // --- DATA DECK ---
        const structures = [
            { id: "skin", name: "Skin", exp: "The outermost integumentary layer pulled back to reveal the musculature." },
            { id: "muscles", name: "Muscles", exp: "The abdominal and thoracic wall muscles cut and pinned back to expose the internal cavities." },
            { id: "ribs", name: "Ribs", exp: "The bony cage protecting the thoracic cavity." },
            { id: "trachea", name: "Trachea", exp: "The ribbed cartilaginous tube (windpipe) carrying air to the lungs." },
            { id: "thymus", name: "Thymus", exp: "A pale, glandular organ situated over the cranial portion of the heart, part of the immune system." },
            { id: "lungs", name: "Right and left lungs", exp: "Spongy, multi-lobed respiratory organs flanking the heart." },
            { id: "heart", name: "Heart", exp: "The muscular, dark red pump in the center of the thoracic cavity." },
            { id: "diaphragm", name: "Diaphragm", exp: "The thin muscular sheet separating the thoracic and abdominal cavities." },
            { id: "liver", name: "Liver", exp: "The massive, deep reddish-brown, multi-lobed organ at the top of the abdominal cavity." },
            { id: "stomach", name: "Stomach", exp: "The curved, pale digestive pouch located partially under the left side of the liver." },
            { id: "spleen", name: "Spleen", exp: "A dark red/purple, flat organ attached to the greater curvature of the stomach." },
            { id: "small_intestine", name: "Small intestine", exp: "The highly coiled, dense winding tube where most digestion and absorption occurs." },
            { id: "caecum", name: "Caecum", exp: "A large, dark comma-shaped pouch at the junction of the small and large intestines." },
            { id: "large_intestine", name: "Large intestine", exp: "The wider, descending tube responsible for water absorption, leading down to the rectum." },
            { id: "kidneys", name: "Right and left kidneys", exp: "Dark brown, bean-shaped excretory organs located against the dorsal body wall (retroperitoneal)." },
            { id: "anus", name: "Anus (external orifice)", exp: "The terminal opening of the digestive tract." },
            { id: "scrotal_sac", name: "Scrotal sac", exp: "The external sac of skin containing the testes in males." },
            { id: "testes", name: "Testes", exp: "The pale, oval male gonads responsible for sperm production." },
            { id: "prostate", name: "Prostate", exp: "Lobed glandular tissue located at the base of the bladder/urethra in males." },
            { id: "urethral_aperture_male", name: "Urethral aperture (Male)", exp: "The urogenital opening at the tip of the penis." },
            { id: "uterine_horns", name: "Uterine horns", exp: "The thick, V-shaped branches of the uterus where multiple rat embryos develop." },
            { id: "vaginal_orifice", name: "Vaginal orifice", exp: "The external opening of the female reproductive tract." },
            { id: "urethral_aperture_female", name: "Urethral aperture (Female)", exp: "The distinct excretory opening for urine, located just superior (cranial) to the vaginal orifice." }
        ];

        // --- ENGINE STATE ---
        let mcqState = { deck: [], idx: 0, attempts: 0, correct: 0 };
        let hintUsed = false;
        let lockBoard = false;

        // --- UTILS ---
        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function init() {
            mcqState = { deck: shuffle([...structures]), idx: 0, attempts: 0, correct: 0 };
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('svg-arena').style.display = 'block';
            document.getElementById('target-area').style.display = 'flex';

            document.querySelectorAll('.organ-group').forEach(group => {
                group.classList.remove('correct', 'wrong', 'dimmed', 'locked');
                group.onclick = () => handleGuess(group, group.dataset.id);
            });

            loadCard();
        }

        function loadCard() {
            if (mcqState.idx >= mcqState.deck.length) {
                endDrill();
                return;
            }

            lockBoard = false;
            hintUsed = false;
            
            const currentCard = mcqState.deck[mcqState.idx];

            document.getElementById('clue-text').innerText = currentCard.name;
            document.getElementById('prog-text').innerText = `Structure ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('hint-btn').disabled = false;
            
            document.querySelectorAll('.organ-group').forEach(group => {
                group.classList.remove('correct', 'wrong', 'dimmed', 'locked');
            });
        }

        function handleGuess(clickedGroup, clickedId) {
            if (lockBoard) return;
            lockBoard = true;
            document.getElementById('hint-btn').disabled = true;

            const currentCard = mcqState.deck[mcqState.idx];
            const fb = document.getElementById('feedback');
            const allGroups = document.querySelectorAll('.organ-group');
            
            mcqState.attempts++;
            
            const isCorrect = (clickedId === currentCard.id);

            if (isCorrect) {
                clickedGroup.classList.add('correct');
                
                if (hintUsed) {
                    mcqState.deck.push(mcqState.deck[mcqState.idx]); 
                    fb.innerHTML = `<strong style="color:var(--success);">✅ Correct (Hint Used).</strong><br><br>${currentCard.exp}<br><br><em style="color:var(--accent);">Card recycled to the back of the deck.</em>`;
                    fb.style.borderLeftColor = 'var(--success)';
                } else {
                    mcqState.correct++;
                    fb.innerHTML = `<strong style="color:var(--success);">✅ Correct!</strong><br><br>${currentCard.exp}`;
                    fb.style.borderLeftColor = 'var(--success)';
                }
            } else {
                clickedGroup.classList.add('wrong');
                mcqState.deck.push(mcqState.deck[mcqState.idx]); 
                
                const clickedObj = structures.find(s => s.id === clickedId);
                const actualName = clickedObj ? clickedObj.name : "an incorrect structure";

                allGroups.forEach(g => {
                    if (g.dataset.id === currentCard.id) g.classList.add('correct');
                });

                let prefix = hintUsed ? `<strong style="color:var(--error);">❌ Incorrect (Hint Used).</strong>` : `<strong style="color:var(--error);">❌ Incorrect.</strong>`;
                fb.innerHTML = `${prefix}<br><br>You clicked the <strong>${actualName}</strong>.<br>The correct location for the <strong>${currentCard.name}</strong> is highlighted in green.<br><br><em style="color:var(--accent);">Card recycled to the back of the deck.</em>`;
                fb.style.borderLeftColor = 'var(--error)';
            }
            
            allGroups.forEach(g => {
                g.classList.add('locked'); 
                if (!g.classList.contains('correct') && !g.classList.contains('wrong')) {
                    g.classList.add('dimmed');
                }
            });

            document.getElementById('prog-text').innerText = `Structure ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            fb.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function useHint() {
            if (lockBoard || hintUsed) return;
            hintUsed = true;
            
            const currentCard = mcqState.deck[mcqState.idx];
            const allGroups = Array.from(document.querySelectorAll('.organ-group'));
            
            const correctGroup = allGroups.find(g => g.dataset.id === currentCard.id);
            const wrongGroups = shuffle(allGroups.filter(g => g.dataset.id !== currentCard.id));
            
            const keepActive = [correctGroup, wrongGroups[0], wrongGroups[1], wrongGroups[2]];
            
            allGroups.forEach(g => {
                if (!keepActive.includes(g)) {
                    g.classList.add('dimmed');
                    g.classList.add('locked');
                }
            });
            
            document.getElementById('hint-btn').disabled = true;
        }

        function nextCard() {
            mcqState.idx++;
            loadCard();
        }

        function endDrill() {
            document.getElementById('target-area').style.display = 'none';
            document.getElementById('svg-arena').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            const pct = Math.round((mcqState.correct / mcqState.attempts) * 100) || 0;
            document.getElementById('final-score').innerHTML = `You correctly identified <strong>${mcqState.correct}</strong> structures without hints on the first try out of <strong>${mcqState.attempts}</strong> total attempts (${pct}% accuracy).`;
        }

        init();

    </script>

    <script src="../../../Global/Scripts/background-animation.js" data-base-path="../../../"></script>
</body>
</html>
