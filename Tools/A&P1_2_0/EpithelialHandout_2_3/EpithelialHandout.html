<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Epithelial Tissues</title>
    <link rel="stylesheet" href="../../../Global/Css/main.css">
    <link rel="stylesheet" href="../../../Global/Css/animations.css">
    <style>
        h1 {
            color: var(--minimal-white);
            font-family: var(--font-family-display);
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .tool-container {
            width: 100%; max-width: 1100px; display: flex; flex-direction: column; 
            align-items: center; gap: 1.5rem; position: relative;
        }

        /* Top Bar / Tools */
        .header-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            background: var(--panel-bg); padding: 1rem 1.5rem; border-radius: 8px;
            box-sizing: border-box; flex-wrap: wrap; gap: 1rem; border-bottom: 1px dashed var(--hover-bg);
        }
        .progress-text { font-family: var(--font-family-mono); font-size: 0.95rem; color: var(--text-muted); font-weight: bold; }
        .tool-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tool-btn {
            background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted);
            padding: 0.4rem 0.8rem; font-family: var(--font-family-mono); font-size: 0.9rem; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .tool-btn.active { border-color: var(--accent); color: var(--accent); }
        .tool-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--hover-bg); }
        .tool-btn:disabled { opacity: 0.3; cursor: default; }

        /* The Blueprint Scanner (Target Box) */
        .scanner-box {
            background: var(--hover-bg); border: 2px solid var(--accent); border-radius: 8px;
            padding: 2.5rem; box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;
            min-height: 200px; justify-content: center; position: relative;
        }
        .asset-type-badge {
            position: absolute; top: 1rem; left: 1rem; padding: 0.3rem 0.8rem; border-radius: 4px;
            font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(165, 104, 157, 0.2); color: var(--accent); border: 1px solid var(--accent);
        }

        .asset-text {
            font-size: 1.4rem; line-height: 1.6; color: var(--text-main); text-align: center; 
            max-width: 800px; font-weight: bold; font-family: var(--font-family-main);
        }

        /* Hint Display */
        .hint-display {
            background: var(--hover-bg); border: 1px solid var(--accent); color: var(--accent);
            padding: 1rem; border-radius: 6px; font-size: 0.95rem; margin-top: 1rem; display: none; line-height: 1.5; width: 100%; box-sizing: border-box;
        }

        /* Hierarchy Columns */
        .hierarchy-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; width: 100%;
        }
        
        .column {
            background: var(--panel-bg); border: 1px solid var(--text-muted); border-radius: 8px;
            padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; opacity: 0.4; pointer-events: none;
            transition: 0.3s; position: relative;
        }
        .column.active { opacity: 1; pointer-events: all; border-color: var(--accent); box-shadow: 0 0 15px rgba(165, 104, 157, 0.1);}
        
        .col-header {
            display: flex; justify-content: space-between; align-items: center;
            font-family: var(--font-family-mono); color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 1px; font-size: 0.85rem; margin-bottom: 0.5rem; border-bottom: 1px dashed var(--hover-bg); padding-bottom: 0.8rem;
        }

        .step-hint-btn {
            background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);
            padding: 0.2rem 0.6rem; font-family: var(--font-family-mono); font-size: 0.75rem; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .step-hint-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--hover-bg); }
        .step-hint-btn:disabled { opacity: 0.2; cursor: default; }

        /* Tier Buttons & Tooltips */
        .tier-btn {
            background: var(--bg-color); border: 2px solid var(--text-muted); color: var(--text-main);
            padding: 1rem; border-radius: 6px; font-family: var(--font-family-mono); font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s; font-weight: bold; position: relative; text-align: left;
        }
        
        .tier-btn-text { pointer-events: none; }
        
        .opt-tooltip {
            position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--bg-color); color: var(--accent); padding: 0.8rem 1rem;
            border-radius: 6px; border: 1px solid var(--accent); font-size: 0.85rem;
            width: max-content; max-width: 260px; white-space: normal;
            z-index: 100; opacity: 0; visibility: hidden; transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none; text-align: center; font-weight: normal; line-height: 1.4;
        }
        .opt-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border-width: 6px; border-style: solid; border-color: var(--accent) transparent transparent transparent;
        }

        .tier-btn:hover:not(:disabled):not(.dimmed) { border-color: var(--accent); transform: translateY(-2px); background: var(--hover-bg); }
        .tier-btn:hover:not(:disabled):not(.dimmed) .opt-tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        .hierarchy-grid.hide-tooltips .opt-tooltip { display: none !important; }

        .tier-btn.selected { border-color: var(--accent) !important; background: rgba(165, 104, 157, 0.2) !important; color: var(--accent); }
        .tier-btn.wrong { border-color: var(--error) !important; background: rgba(224, 94, 117, 0.2) !important; animation: shake 0.3s; }
        .tier-btn.dimmed { opacity: 0.2; pointer-events: none; border-color: var(--hover-bg); }
        .tier-btn:disabled { cursor: default; transform: none; }

        /* Feedback Box */
        .feedback-box {
            padding: 1.5rem; border-radius: 4px; display: none; line-height: 1.6; font-size: 1.05rem;
            background: var(--hover-bg); border-left: 4px solid var(--accent); width: 100%; box-sizing: border-box;
        }

        .action-btn {
            background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 1rem;
            font-family: var(--font-family-mono); font-size: 1.05rem; cursor: pointer; border-radius: 6px; transition: 0.2s; width: 100%;
            margin-top: 1rem; font-weight: bold; display: none; text-align: center;
        }
        .action-btn:hover { background: var(--accent); color: var(--bg-color); }

        /* Session Tracking Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; text-align: center; width: 100%; margin-top: 1rem;}
        .stat-card { background: var(--panel-bg); border: 1px solid var(--text-muted); padding: 1.5rem 1rem; border-radius: 6px; display: flex; flex-direction: column; gap: 0.5rem; }
        .stat-val { font-family: var(--font-family-mono); color: var(--accent); font-size: 1.5rem; font-weight: bold; }
        .stat-label { font-family: var(--font-family-mono); color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        .end-screen { text-align: center; display: none; background: var(--panel-bg); padding: 3rem; border-radius: 8px; border: 2px solid var(--success); width: 100%; box-sizing: border-box;}
        .end-screen h2 { color: var(--success); margin-bottom: 1rem; }

        @media (max-width: 800px) {
            .hierarchy-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <img src="../../../Global/SVGs/logo.svg" alt="Study Hub Logo" class="corner-logo">
    <img src="../../../Global/SVGs/avatar.svg" alt="Avatar" class="corner-avatar">

    <div class="content-wrapper">
        <h1>Epithelial Tissues</h1>

        <div class="tool-container">
        
        <div class="header-row">
            <div class="progress-text" id="prog-text">Loading...</div>
            <div class="tool-btns">
                <button class="tool-btn active" id="tooltip-btn" onclick="toggleTooltips()">👁️ Tooltips</button>

            </div>
        </div>

            <div class="scanner-box" id="scanner-box">
                <div class="asset-type-badge" id="asset-badge">BIOLOGICAL TARGET</div>
                <div class="asset-text" id="q-text">Initializing blueprint...</div>
                <div id="hint-display" class="hint-display"></div>
            </div>

            <div class="hierarchy-grid" id="hierarchy-grid">
                <div class="column active" id="col-1">
                    <div class="col-header">
                        <span>1. Primary Class</span>
                        <button class="step-hint-btn" id="hint-btn-1" onclick="useStepHint(1)">💡 Hint</button>
                    </div>
                    <div id="t1-options" style="display:flex; flex-direction:column; gap:1rem;">
                        </div>
                </div>

                <div class="column" id="col-2">
                    <div class="col-header">
                        <span>2. Sub-Category</span>
                        <button class="step-hint-btn" id="hint-btn-2" onclick="useStepHint(2)">💡 Hint</button>
                    </div>
                    <div id="t2-options" style="display:flex; flex-direction:column; gap:1rem;">
                        </div>
                </div>

                <div class="column" id="col-3">
                    <div class="col-header">
                        <span>3. Specific Tissue</span>
                        <button class="step-hint-btn" id="hint-btn-3" onclick="useStepHint(3)">💡 Hint</button>
                    </div>
                    <div id="t3-options" style="display:flex; flex-direction:column; gap:1rem;">
                        </div>
                </div>
            </div>

            <div id="feedback" class="feedback-box"></div>
            <button id="next-btn" class="action-btn" onclick="nextCard()">Synthesize Next Target ➔</button>

        </div>

        <div class="stats-grid" id="stats-area">
            <div class="stat-card"><div class="stat-val" id="stat-session-time">00:00</div><div class="stat-label">Current Session</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-accuracy">0%</div><div class="stat-label">Synthesis Accuracy</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-cards">0</div><div class="stat-label">Tissues Built</div></div>
        </div>

        <div id="end-screen" class="end-screen">
            <h2>Synthesis Complete!</h2>
            <p id="final-score" style="margin-bottom: 2rem; color: var(--text-main); font-size:1.1rem;"></p>
            <button class="action-btn" style="display:block;" onclick="init()">Restart Protocol</button>
        </div>

    </div>

                };

                // --- ENGINE STATE ---
        let mcqState = { deck: [], idx: 0, attempts: 0, correct: 0 };
        let currentPathIndex = 0; 
        let lockBoard = false;
        let chopsUsed = 0;
        let cardFailed = false; 
        let tooltipsOn = true;
        
        let sessionTimer = 0; 
        let statsInterval = null;

        // --- UTILS ---
        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function createTierButton(val, tierIndex) {
            const btn = document.createElement('button');
            btn.className = `tier-btn t${tierIndex+1}-btn`;
            btn.dataset.val = val;
            
            let html = `<span class="tier-btn-text">${val}</span>`;
            if (defs[val]) {
                html += `<div class="opt-tooltip">${defs[val]}</div>`;
            }
            btn.innerHTML = html;
            
            btn.onclick = () => handleSelection(tierIndex, val, btn);
            return btn;
        }

        // --- CORE ENGINE ---
        function init() {
            mcqState = { deck: shuffle([...rawData]), idx: 0, attempts: 0, correct: 0 };
            sessionTimer = 0;
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('target-area').style.display = 'flex';
            document.getElementById('stats-area').style.display = 'grid';

            if(statsInterval) clearInterval(statsInterval);
            statsInterval = setInterval(() => {
                sessionTimer++;
                document.getElementById('stat-session-time').innerText = formatTime(sessionTimer);
            }, 1000);

            loadCard();
        }

        function loadCard() {
            if (mcqState.idx >= mcqState.deck.length) {
                endDrill();
                return;
            }

            lockBoard = false;
            chopsUsed = 0;
            currentPathIndex = 0;
            cardFailed = false;
            
            const currentCard = mcqState.deck[mcqState.idx];

            document.getElementById('prog-text').innerText = `Target ${mcqState.idx + 1} of ${mcqState.deck.length}`;
            document.getElementById('q-text').innerText = `"${currentCard.text}"`;
            
            // Reset UI
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('chop-btn').disabled = false;
            
            document.getElementById('hint-display').style.display = 'none';
            document.getElementById('hint-btn-1').disabled = false;
            document.getElementById('hint-btn-2').disabled = true;
            document.getElementById('hint-btn-3').disabled = true;
            
            // Reset Columns
            document.getElementById('col-1').classList.add('active');
            document.getElementById('col-2').classList.remove('active');
            document.getElementById('col-3').classList.remove('active');
            
            const t1Container = document.getElementById('t1-options');
            t1Container.innerHTML = '';
            ["Epithelial", "Connective", "Muscle", "Neural"].forEach(val => {
                t1Container.appendChild(createTierButton(val, 0));
            });
            
            document.getElementById('t2-options').innerHTML = '';
            document.getElementById('t3-options').innerHTML = '';
        }

        function renderNextColumn(tierIndex, previousSelection) {
            if (tierIndex === 1) {
                const col2 = document.getElementById('col-2');
                const t2Container = document.getElementById('t2-options');
                t2Container.innerHTML = '';
                
                const subs = Object.keys(structureMap[previousSelection]);
                subs.forEach(sub => {
                    t2Container.appendChild(createTierButton(sub, 1));
                });
                
                document.getElementById('hint-btn-2').disabled = false;
                col2.classList.add('active');
            } 
            else if (tierIndex === 2) {
                const col3 = document.getElementById('col-3');
                const t3Container = document.getElementById('t3-options');
                t3Container.innerHTML = '';
                
                const currentCard = mcqState.deck[mcqState.idx];
                const t1Choice = currentCard.path[0];
                const specifics = structureMap[t1Choice][previousSelection];
                
                specifics.forEach(spec => {
                    t3Container.appendChild(createTierButton(spec, 2));
                });
                
                document.getElementById('hint-btn-3').disabled = false;
                col3.classList.add('active');
            }
        }

        function toggleTooltips() {
            tooltipsOn = !tooltipsOn;
            const btn = document.getElementById('tooltip-btn');
            const grid = document.getElementById('hierarchy-grid');
            
            if (tooltipsOn) {
                btn.classList.add('active');
                grid.classList.remove('hide-tooltips');
            } else {
                btn.classList.remove('active');
                grid.classList.add('hide-tooltips');
            }
        }

        function useStepHint(tier) {
            if (lockBoard) return;
            const currentCard = mcqState.deck[mcqState.idx];
            
            cardFailed = true; 
            
            // Get the specific hint for this tier (hint1, hint2, hint3)
            const hintText = currentCard[`hint${tier}`];
            
            document.getElementById('hint-display').innerHTML = `<strong>💡 Hint:</strong> ${hintText}`;
            document.getElementById('hint-display').style.display = 'block';
            
            document.getElementById(`hint-btn-${tier}`).disabled = true;
        }

        function useChop() {
            if (lockBoard || chopsUsed >= 2) return;
            
            const currentCard = mcqState.deck[mcqState.idx];
            const targetAnswer = currentCard.path[currentPathIndex];
            
            const activeColClass = `.t${currentPathIndex + 1}-btn`;
            const allBtns = Array.from(document.querySelectorAll(activeColClass));
            const availableWrongBtns = allBtns.filter(b => b.dataset.val !== targetAnswer && !b.classList.contains('dimmed') && !b.classList.contains('wrong'));

            if (availableWrongBtns.length > 0) {
                chopsUsed++;
                const idx = Math.floor(Math.random() * availableWrongBtns.length);
                const btnToChop = availableWrongBtns.splice(idx, 1)[0];
                btnToChop.classList.add('dimmed');
                btnToChop.disabled = true;

                if (availableWrongBtns.length === 0 || chopsUsed >= 2) {
                    document.getElementById('chop-btn').disabled = true;
                }
            }
        }

        function handleSelection(tier, val, btn) {
            if (lockBoard || btn.disabled || tier !== currentPathIndex) return;

            const currentCard = mcqState.deck[mcqState.idx];
            
            if (val === currentCard.path[currentPathIndex]) {
                // Correct Choice
                btn.classList.add('selected');
                
                document.querySelectorAll(`.t${tier+1}-btn`).forEach(b => {
                    if (b !== btn) {
                        b.classList.add('dimmed');
                        b.disabled = true;
                    }
                });

                document.getElementById(`col-${tier+1}`).classList.remove('active');
                document.getElementById(`hint-btn-${tier+1}`).disabled = true; // Disable hint for finished col

                currentPathIndex++;
                
                if (currentPathIndex === 3) {
                    // SYNTHESIS COMPLETE
                    lockBoard = true;
                    document.getElementById('chop-btn').disabled = true;
                    mcqState.attempts++;
                    
                    const fb = document.getElementById('feedback');
                    
                    if (!cardFailed) {
                        mcqState.correct++;
                        fb.innerHTML = `<strong style="color:var(--success);">✅ Synthesis Perfect.</strong><br><br>Path: ${currentCard.path.join(' ➔ ')}<br><br>${currentCard.exp}`;
                        fb.style.borderLeftColor = 'var(--success)';
                    } else {
                        mcqState.deck.push(mcqState.deck[mcqState.idx]); 
                        fb.innerHTML = `<strong style="color:var(--hard);">⚠️ Synthesis Completed (with errors/tools).</strong><br><br>Path: ${currentCard.path.join(' ➔ ')}<br><br>${currentCard.exp}<br><br><em style="color:var(--accent);">Target recycled for later review.</em>`;
                        fb.style.borderLeftColor = 'var(--hard)';
                    }
                    
                    fb.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                    
                    updateStats();
                } else {
                    renderNextColumn(currentPathIndex, val);
                    chopsUsed = 0; 
                    document.getElementById('chop-btn').disabled = false;
                    document.getElementById('hint-display').style.display = 'none'; // Clear previous hint
                }

            } else {
                // Wrong Choice (FAIL FORWARD LOGIC)
                btn.classList.add('wrong');
                btn.disabled = true;
                cardFailed = true; 
            }
        }

        function updateStats() {
            document.getElementById('stat-cards').innerText = mcqState.attempts;
            let acc = Math.round((mcqState.correct / mcqState.attempts) * 100);
            document.getElementById('stat-accuracy').innerText = acc + "%";
        }

        function nextCard() {
            mcqState.idx++;
            loadCard();
        }

        function endDrill() {
            clearInterval(statsInterval);
            document.getElementById('target-area').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            const pct = Math.round((mcqState.correct / mcqState.attempts) * 100) || 0;
            document.getElementById('final-score').innerHTML = `You perfectly synthesized <strong>${mcqState.correct}</strong> histological targets without errors or hints out of <strong>${mcqState.attempts}</strong> total attempts (${pct}% accuracy).`;
        }

        // Boot
        init();

    </script>
</body>
</html>
